<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

  <!-- Background circle -->
  <defs>
    <radialGradient id="bg_grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1e1e3e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="256" cy="256" r="256" fill="url(#bg_grad)"/>

  <!-- Terminal frame -->
  <rect x="60" y="100" width="392" height="280"
        rx="24" ry="24"
        fill="#181825"
        stroke="#89b4fa"
        stroke-width="6"/>

  <!-- Terminal title bar -->
  <rect x="60" y="100" width="392" height="48"
        rx="24" ry="24"
        fill="#313244"/>
  <rect x="60" y="124" width="392" height="24"
        fill="#313244"/>

  <!-- Title bar dots -->
  <circle cx="102" cy="124" r="10" fill="#f38ba8"/>
  <circle cx="136" cy="124" r="10" fill="#f9e2af"/>
  <circle cx="170" cy="124" r="10" fill="#a6e3a1"/>

  <!-- Title bar text -->
  <text x="256" y="132"
        text-anchor="middle"
        font-family="Consolas, monospace"
        font-size="18"
        fill="#6c7086"
        font-weight="bold">
    AI Command Assistant
  </text>

  <!-- Terminal lines -->
  <text x="90" y="196"
        font-family="Consolas, monospace"
        font-size="22"
        fill="#a6e3a1"
        filter="url(#glow)">$ ollama run llama3</text>

  <text x="90" y="234"
        font-family="Consolas, monospace"
        font-size="20"
        fill="#89b4fa">
    &gt; How do I check CPU?
  </text>

  <text x="90" y="268"
        font-family="Consolas, monospace"
        font-size="18"
        fill="#cdd6f4">top -bn1 | grep "Cpu(s)"</text>

  <!-- AI brain icon (circuit lines) -->
  <circle cx="256" cy="330" r="28"
          fill="none"
          stroke="#cba6f7"
          stroke-width="4"
          filter="url(#glow)"/>

  <line x1="256" y1="302" x2="256" y2="280"
        stroke="#cba6f7" stroke-width="3"/>
  <line x1="228" y1="330" x2="200" y2="330"
        stroke="#cba6f7" stroke-width="3"/>
  <line x1="284" y1="330" x2="312" y2="330"
        stroke="#cba6f7" stroke-width="3"/>
  <line x1="236" y1="310" x2="218" y2="292"
        stroke="#cba6f7" stroke-width="3"/>
  <line x1="276" y1="310" x2="294" y2="292"
        stroke="#cba6f7" stroke-width="3"/>

  <!-- AI text in circle -->
  <text x="256" y="337"
        text-anchor="middle"
        font-family="Consolas, monospace"
        font-size="20"
        font-weight="bold"
        fill="#cba6f7"
        filter="url(#glow)">AI</text>

  <!-- Cursor blink line -->
  <rect x="90" y="350" width="16" height="22"
        fill="#89b4fa"
        opacity="0.9"
        filter="url(#glow)"/>

  <!-- Outer ring glow -->
  <circle cx="256" cy="256" r="250"
          fill="none"
          stroke="#89b4fa"
          stroke-width="3"
          opacity="0.3"/>

</svg>
