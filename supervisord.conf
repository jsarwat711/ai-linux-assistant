###############################################################
# Supervisor — manages all processes inside container
###############################################################

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# ── VNC SERVER ────────────────────────────────────────────
[program:vncserver]
command=vncserver :1 -geometry 1600x900 -depth 24 -rfbport 5901 -rfbauth /root/.vnc/passwd -localhost no -fg
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/vnc.log
stderr_logfile=/var/log/supervisor/vnc_err.log
priority=10

# ── OPENBOX ───────────────────────────────────────────────
[program:openbox]
command=bash -c "sleep 2 && DISPLAY=:1 openbox-session"
environment=DISPLAY=":1"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/openbox.log
stderr_logfile=/var/log/supervisor/openbox_err.log
priority=20

# ── noVNC ─────────────────────────────────────────────────
[program:novnc]
command=websockify --web /usr/share/novnc --wrap-mode=ignore 0.0.0.0:6080 localhost:5901
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc_err.log
priority=30

# ── APP ───────────────────────────────────────────────────
[program:app]
command=bash -c "sleep 4 && DISPLAY=:1 python3 /app/ai_linux_assistant.py"
environment=DISPLAY=":1",OLLAMA_HOST="ollama",OLLAMA_PORT="11434"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/app.log
stderr_logfile=/var/log/supervisor/app_err.log
priority=40
